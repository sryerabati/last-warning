[project]
name = "last-warning"
version = "0.1.0"
description = "Reproducible emergency warning experiments and counterfactual replay"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mesa==3.3.1", "networkx==3.5", "numpy==2.2.6",
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "python-multipart>=0.0.20",
  "boto3>=1.40,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.12"]
aws = ["boto3>=1.40,<2"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

